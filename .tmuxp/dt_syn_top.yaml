session_name: syn_top
windows:
  - window_name: cli
    panes:
      - cd ~/research/synapse_topography; source .venv/bin/activate; clear; claude

  - window_name: marimo
    panes:
      - cd ~/research/synapse_topography; source .venv/bin/activate; marimo edit --headless --port 8080 --token --token-password="lab-gui"

  - window_name: main
    panes:
      - cd ~/research/synapse_topography/; source .venv/bin/activate;clear


  - window_name: src
    panes:
      - cd ~/research/synapse_topography/; source .venv/bin/activate; cd src/synapse_topography;clear

  - window_name: simulations
    panes:
      - cd ~/research/synapse_topography/; source .venv/bin/activate; cd experiments/simulations;clear
